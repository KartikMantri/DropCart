# Calls DropCart's scheduled price check every 6 hours.
# Repository secrets (Settings → Secrets and variables → Actions):
#   DROPCART_URL  e.g. https://drop-cart-tan.vercel.app
#   CRON_SECRET   same value as the app's CRON_SECRET
name: Price checks

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the hour
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DROPCART_URL: ${{ secrets.DROPCART_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip until the app is deployed
        if: ${{ env.DROPCART_URL == '' }}
        run: echo "DROPCART_URL secret not set yet; skipping."
      - name: POST /api/cron/check
        if: ${{ env.DROPCART_URL != '' }}
        run: |
          # Tolerate a trailing slash in the secret; a redirect would otherwise
          # look like success (curl --fail only fails on 4xx/5xx).
          url="${DROPCART_URL%%/}"
          url="${url%/}"
          case "$url" in https://*) ;; *) echo "::error::DROPCART_URL must start with https://"; exit 1 ;; esac
          status=$(curl --silent --show-error --max-time 90 -o body.json -w '%{http_code}' \
            -X POST "$url/api/cron/check" \
            -H "Authorization: Bearer $CRON_SECRET")
          cat body.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Expected HTTP 200, got $status (401 = CRON_SECRET mismatch, 3xx = wrong DROPCART_URL)"
            exit 1
          fi
          grep -q '"checked"' body.json || { echo "::error::Unexpected response body"; exit 1; }
